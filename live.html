<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Scan Counter</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;700&family=Space+Mono:wght@400;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root {
  --bg: #2D2A27; --surface: #3B3733; --ink: #FFF5E3; --muted: #B3AA9C; --accent: #FF7023; --crit: #A83424;
  --display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --mono: "Space Mono", ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--display); }
main { height: 100%; display: grid; grid-template-columns: 1fr auto; gap: 6vw; align-items: center; padding: 6vh 6vw; }
.label { font-family: var(--mono); font-size: 1.6vw; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.count { font-size: 24vw; font-weight: 700; line-height: .9; letter-spacing: -.03em; font-variant-numeric: tabular-nums; transition: color .3s; }
.count.bump { animation: bump .5s cubic-bezier(.2,1.6,.4,1); color: var(--accent); }
@keyframes bump { from { transform: scale(1.18) } to { transform: scale(1) } }
.caption { font-size: 3vw; font-weight: 700; max-width: 22ch; line-height: 1.15; }
.sub { font-size: 1.6vw; color: var(--muted); margin-top: 1.5vh; }
.qr { background: #fff; padding: 1.6vw; border-radius: 1vw; align-self: start; }
.qr img, .qr canvas { display: block; width: min(24vw, 46vh) !important; height: min(24vw, 46vh) !important; }
.status { position: fixed; bottom: 2vh; left: 6vw; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.status.err { color: var(--accent); }
#pops { position: fixed; bottom: 4vh; right: 4vw; display: flex; flex-direction: column; align-items: flex-end; gap: 1.2vh; pointer-events: none; z-index: 5; }
.pop { display: flex; align-items: center; gap: .6em; background: var(--surface); color: var(--ink); border-radius: 16px; padding: .5em 1em;
  font-size: clamp(18px, 2.2vw, 40px); font-weight: 700; box-shadow: 0 8px 28px rgba(0,0,0,.4); animation: popin .5s cubic-bezier(.2,1.5,.4,1) both; }
.pop .plus { background: var(--accent); color: var(--bg); border-radius: 99px; padding: .05em .5em; }
.pop .sub { font-family: var(--mono); font-size: .55em; color: var(--accent); font-weight: 400; }
.pop.out { animation: popout .5s ease both; }
@keyframes popin { from { opacity: 0; transform: translateX(60px) scale(.85) } to { opacity: 1; transform: none } }
@keyframes popout { to { opacity: 0; transform: translateY(-10px) } }
@media (max-width: 800px) { main { grid-template-columns: 1fr; } .qr img, .qr canvas { width: 60vw !important; height: 60vw !important; } }
body.raffle main { grid-template-columns: 1fr; padding: 7vh 8vw; align-content: center; gap: 2vh; }
body.raffle .qr, body.raffle .status { display: none; }
body.raffle .label { font-size: 4vw; }
body.raffle .count { font-size: 48vw; }
body.raffle .caption { font-size: 7vw; }
body.raffle .sub { font-size: 4.2vw; }
body.raffle .pop { font-size: 4.5vw; }
@media (prefers-reduced-motion: reduce) { .count.bump, .pop, .pop.out { animation: none } }
</style>
</head>
<body>
<main>
  <section>
    <div class="label" id="lbl">Live from this room</div>
    <div class="count" id="count">0</div>
    <div class="caption" id="cap">people just scanned a QR code from a stranger.</div>
    <div class="sub" id="sub">At a cyber resilience talk. There is no espresso machine.</div>
  </section>
  <div class="qr" id="qr" aria-label="QR code to the giveaway page"></div>
</main>
<div id="pops"></div>
<div class="status" id="status">Connecting…</div>
<script>
const NS = "everpure-cyber-falko";
const KEY = (new URLSearchParams(location.search).get("key") || "scans").replace(/[^a-z0-9-]/gi, "").slice(0, 40) || "scans";
const RAFFLE = new URLSearchParams(location.search).get("mode") === "raffle";
let NOUN = ["victim", "victims"];
if (RAFFLE) {
  document.body.classList.add("raffle");
  document.getElementById("lbl").textContent = "Entries so far";
  document.getElementById("cap").textContent = "colleagues have already entered.";
  document.getElementById("sub").textContent = "Only 3 espresso machines left. Scan the code to join them.";
  NOUN = ["new entry", "new entries"];
}
const target = new URL("index.html", location.href); target.search = "?k=" + KEY;
try {
  new QRCode(document.getElementById("qr"), { text: target.href, width: 512, height: 512, colorDark: "#2D2A27", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
} catch (e) {
  const q = document.getElementById("qr");
  q.textContent = target.href;
  q.style.cssText = "color:#2D2A27;font:16px monospace;max-width:26vw;word-break:break-all";
}

const el = document.getElementById("count"), st = document.getElementById("status"), pops = document.getElementById("pops");
const QUIPS = RAFFLE
  ? ["is feeling lucky", "wants that espresso machine", "entered the draw", "is one step closer to free coffee", "just joined the raffle"]
  : ["trusted a random QR code", "wanted that espresso machine", "clicked first, thought later", "is now a statistic", "just got quished"];
function pop(n) {
  const d = document.createElement("div"); d.className = "pop";
  d.innerHTML = '<span class="plus">+1</span><span class="what"></span><span class="sub"></span>';
  d.querySelector(".what").textContent = NOUN[0].replace("new ", "");
  d.querySelector(".sub").textContent = "#" + n + " " + QUIPS[n % QUIPS.length];
  pops.append(d);
  while (pops.children.length > (RAFFLE ? 5 : 3)) pops.firstChild.remove();
  setTimeout(() => { d.classList.add("out"); setTimeout(() => d.remove(), 500); }, 7000);
}
let last = null, base = null;
const ALLTIME = new URLSearchParams(location.search).get("total") === "all";
async function poll() {
  try {
    const r = await fetch("https://abacus.jasoncameron.dev/get/" + NS + "/" + KEY, { cache: "no-store" });
    const raw = r.status === 404 ? 0 : (await r.json()).value;
    if (base === null) base = ALLTIME ? 0 : raw;
    const v = raw - base;
    if (typeof v === "number" && v !== last) {
      if (last !== null && v > last) {
        el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump");
        const k = Math.min(v - last, 10); for (let i = k - 1; i >= 0; i--) setTimeout(() => pop(v - i), (k - 1 - i) * 350);
      }
      el.textContent = v; last = v;
    }
    st.className = "status"; st.textContent = "Live · counter “" + KEY + "” · " + target.href;
  } catch (e) {
    st.className = "status err"; st.textContent = "Counter not reachable. Check the venue Wi-Fi.";
  }
}
poll(); setInterval(poll, 1500);
</script>
</body>
</html>
